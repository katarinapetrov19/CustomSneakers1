<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FABRIK — PIEPPIEPSEPPL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="preload" href="/font/Playpen_Sans/static/PlaypenSans-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="img/logo.svg" alt="PIEPPIEPSEPPL" class="logo-img">
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <section id="fabrik-hero">
        <video class="fabrik-hero-video" autoplay muted loop playsinline poster="img/fabrik.png">
            <source src="img/Fabrik.mp4" type="video/mp4">
        </video>
        <h1 class="fabrik-hero-title" id="fabrikHeroTitle">FABRIK</h1>
    </section>

    <!-- Story Intro -->
    <section id="fabrik-story">
        <blockquote class="fabrik-story-text">
            "It started with a blank canvas and a pair of worn-out shoes."
        </blockquote>
        <img src="img/artist.jpeg" alt="Artist at work" class="fabrik-story-artist">
    </section>

    <!-- Process Video -->
    <section id="fabrik-process">
        <div class="fabrik-polaroid">
            <video autoplay muted loop playsinline>
                <source src="img/projekt.mp4" type="video/mp4">
            </video>
            <p class="fabrik-polaroid-caption"><em>The making.</em></p>
        </div>
    </section>

    <!-- Scatter Gallery -->
    <section id="fabrik-gallery">
        <img src="img/grafiti.png" alt="Graffiti inspiration" class="fabrik-scatter-img fabrik-scatter-grafiti">
        <img src="img/BW.jpg" alt="Black and white study" class="fabrik-scatter-img fabrik-scatter-bw">
        <img src="img/sneakersRW01.jpg" alt="FABRIK sneakers" class="fabrik-scatter-img fabrik-scatter-main">
        <img src="img/Kat.jpg" alt="The artist" class="fabrik-scatter-img fabrik-scatter-kat">
    </section>

    <!-- Statement -->
    <section id="fabrik-statement">
        <p class="fabrik-statement-text pre-anim">EVERY STROKE DELIBERATE.</p>
    </section>

    <!-- Mail Club CTA -->
    <section id="fabrik-cta">
        <h2 class="fabrik-cta-heading">Like what you see?</h2>
        <p class="fabrik-cta-sub">Join Mail Club and receive original artwork monthly.</p>
        <a href="projects.html?plan=maxi" class="mail-club-home-cta-btn fabrik-cta-btn">Get yours — join Mail Club</a>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 PIEPPIEPSEPPL. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Hero parallax
        (function () {
            var titleEl = document.getElementById('fabrikHeroTitle');
            window.addEventListener('scroll', function () {
                var y = window.scrollY;
                if (titleEl) {
                    titleEl.style.transform = 'translateY(' + (y * 0.4) + 'px)';
                }
            }, { passive: true });
        })();

        // IntersectionObserver entrance animations
        (function () {
            var fadeEls = document.querySelectorAll(
                '.fabrik-story-text, .fabrik-story-artist, .fabrik-polaroid, .fabrik-scatter-img'
            );
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('fabrik-visible');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15 });
            fadeEls.forEach(function (el) { io.observe(el); });

            // Statement text animation
            var statementEl = document.querySelector('.fabrik-statement-text');
            if (statementEl) {
                var sio = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            statementEl.classList.remove('pre-anim');
                            sio.unobserve(statementEl);
                        }
                    });
                }, { threshold: 0.4 });
                sio.observe(statementEl);
            }
        })();
    </script>
</body>
</html>
